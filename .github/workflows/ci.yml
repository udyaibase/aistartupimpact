name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  NPM_VERSION: "11.3.0"
  # Dummy values for build (Prisma generate needs DATABASE_URL syntax but won't connect)
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
  DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
  NEXTAUTH_SECRET: "ci-secret"
  NEXTAUTH_URL: "http://localhost:3000"
  ADMIN_NEXTAUTH_URL: "http://localhost:3001"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  JWT_SECRET: "ci-jwt-secret"
  REFRESH_SECRET: "ci-refresh-secret"
  FOUNDER_JWT_SECRET: "ci-founder-secret"
  USER_JWT_SECRET: "ci-user-secret"
  IP_HASH_SALT: "ci-ip-hash-salt-placeholder-value"
  RESEND_API_KEY: "re_placeholder"
  RESEND_FROM_EMAIL: "no-reply@example.com"
  RESEND_FROM_NAME: "CI"
  RESEND_NEWSLETTER_EMAIL: "newsletter@example.com"
  RESEND_NEWSLETTER_NAME: "CI Newsletter"
  RESEND_REPLY_TO: "reply@example.com"
  R2_ACCOUNT_ID: "placeholder"
  R2_ACCESS_KEY_ID: "placeholder"
  R2_SECRET_ACCESS_KEY: "placeholder"
  R2_BUCKET_NAME: "placeholder"
  R2_PUBLIC_URL: "https://placeholder.r2.dev"
  GOOGLE_CLIENT_ID: "placeholder.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "placeholder"
  GOOGLE_REDIRECT_URI: "http://localhost:3000/api/auth/callback"
  GOOGLE_REDIRECT_URI_USER: "http://localhost:3000/api/user/auth/callback"
  UPSTASH_REDIS_REST_URL: ""
  UPSTASH_REDIS_REST_TOKEN: ""
  MEILI_URL: ""
  MEILI_MASTER_KEY: ""
  NEXT_PUBLIC_GA_ID: ""
  NEXT_PUBLIC_SENTRY_DSN: ""
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
  TURNSTILE_SECRET_KEY: ""

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install correct npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Lint
        run: npx turbo run lint

      - name: Type check
        run: npx turbo run typecheck --filter=@udyaibase/web --filter=@udyaibase/admin

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install correct npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Run tests
        run: npm test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install correct npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=critical

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/nodejs
            p/owasp-top-ten
          generateSarif: "1"
        env:
          SEMGREP_RULES: "p/javascript p/typescript p/nodejs p/owasp-top-ten"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install correct npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Build all apps
        run: npx turbo run build

      - name: Upload build artifacts (web)
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 1

      - name: Upload build artifacts (admin)
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: admin-build
          path: apps/admin/.next
          retention-days: 1

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install correct npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Build web app
        run: npx turbo run build --filter=@udyaibase/web

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e --workspace=apps/web
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
